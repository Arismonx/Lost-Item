services:
  db:
    image: postgres:16
    container_name: lostitem-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lostitem
      POSTGRES_PASSWORD: lostitem_pw
      POSTGRES_DB: lostitem
    ports:
      - "5432:5432"
    volumes:
      - lostitem_pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin4_web
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin1234
    ports:
      - "5050:80" # กำหนดพอร์ต (ซ้ายคือพอร์ตในเครื่อง, ขวาคือพอร์ตใน Docker)
    restart: unless-stopped
    depends_on:
      - db

volumes:
  lostitem_pgdata:
